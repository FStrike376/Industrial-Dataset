[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-dataset-etl"
version = "1.0.0"
description = "ETL pipeline for Industrial Dataset"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=6.0",
    "kaleido>=1.0.0",
    "pyarrow>=15.0"
]

[tool.setuptools.packages.find]
where = ["src"]