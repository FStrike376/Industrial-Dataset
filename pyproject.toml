[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-dataset-etl"
version = "1.0.0"
description = "ETL package for Industrial Machine Predictive Maintenance dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "kaleido>=1.0.0",
    "matplotlib>=3.8.0",
    "nbformat>=5.9.0",
    "plotly>=6.0.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
